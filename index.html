<form action="https://api.web3forms.com/submit" method="POST">
  <!-- Chiave Web3Forms -->
  <input type="hidden" name="access_key" value="4c3854ae-cf85-4753-985e-32054e21f7bd">
  <input type="hidden" name="subject" value="Nuova richiesta preventivo dal sito Home Renovation Srl">

  <!-- Reindirizzamento alla pagina stessa dopo l'invio -->
  <!-- Sostituisci l'URL qui sotto con l'indirizzo esatto del tuo sito -->
  <input type="hidden" name="redirect" value="https://homerenovationsrl.github.io/homerenovationsrl/#preventivo">

  <!-- Protezione Anti-Spam (Honeypot) -->
  <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

  <div class="form-grid">
    <div class="form-group">
      <label for="nome">Nome e Cognome *</label>
      <input type="text" id="nome" name="Nome_Cliente" required placeholder="Es. Mario Rossi">
    </div>

    <div class="form-group">
      <label for="email">La tua E-mail di Contatto *</label>
      <input type="email" id="email" name="Email_Cliente" required placeholder="esempio@email.com">
    </div>

    <div class="form-group">
      <label for="telefono">Numero di Telefono *</label>
      <input type="tel" id="telefono" name="Telefono_Cliente" required placeholder="Es. 333 1234567">
    </div>

    <div class="form-group">
      <label for="tipo_lavoro">Tipo di Intervento *</label>
      <select id="tipo_lavoro" name="Tipo_Intervento">
        <option value="Costruzioni e Ristrutturazioni">Costruzioni e Ristrutturazioni</option>
        <option value="Immobiliare">Immobiliare / Vendita</option>
        <option value="Progettazione e Pratiche">Progettazione e Relazioni Energetiche</option>
        <option value="Altro">Altro lavoro</option>
      </select>
    </div>

    <div class="form-group full-width">
      <label for="messaggio">Descrivi la tua richiesta / Progetto *</label>
      <textarea id="messaggio" name="Dettagli_Richiesta" rows="5" required placeholder="Descrivi il lavoro, la metratura, la zona o le tue esigenze..."></textarea>
    </div>

    <div class="form-group full-width">
      <button type="submit" class="btn-submit">Invia Richiesta di Preventivo</button>
    </div>
  </div>
</form>
